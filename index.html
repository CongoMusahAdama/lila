const { useState, useEffect, useRef, useMemo, forwardRef, useImperativeHandle } = React;

function specialBannerText() {
  const now = new Date();
  const mm = String(now.getMonth() + 1).padStart(2, "0");
  const dd = String(now.getDate()).padStart(2, "0");
  const isBirthday = CONFIG.herBirthday === `${mm}-${dd}`;
  const isJummah = now.getDay() === 5;

  if (isBirthday && isJummah) return `Jummah Mubarak & Happy Birthday, ${CONFIG.herName}! 🎉🌙`;
  if (isBirthday) return `Happy Birthday, ${CONFIG.herName}! 🎉`;
  if (isJummah) return "Jummah Mubarak 🌙";
  return null;
}

  );
}

const DuaPlayer = forwardRef(function DuaPlayer(props, ref) {
  const playerRef = useRef(null);
  const containerRef = useRef(null);
  const [isPlayingSound, setIsPlayingSound] = useState(false);
  const videoId = CONFIG.duaVideoId;

  useEffect(() => {
    if (!videoId) return;

    function createPlayer() {
      playerRef.current = new window.YT.Player(containerRef.current, {
        videoId: videoId,
        width: "160",
        height: "160",
        playerVars: {
          autoplay: 1,
          mute: 1,
          loop: 1,
          playlist: videoId,
          controls: 0,
          playsinline: 1,
          modestbranding: 1,
        },
        events: {
          onReady: function (e) { 
            e.target.playVideo(); 
          },
          onStateChange: function (e) {
            if (e.data === window.YT.PlayerState.PLAYING) {
              const muted = playerRef.current && playerRef.current.isMuted();
              setIsPlayingSound(!muted);
            }
          }
        },
      });
    }

    if (window.YT && window.YT.Player) {
      createPlayer();
    } else {
      const tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      document.body.appendChild(tag);
      window.onYouTubeIframeAPIReady = createPlayer;
    }
  }, [videoId]);

  function toggleMute() {
    const player = playerRef.current;
    if (!player) return;
    if (player.isMuted()) {
      player.unMute();
      player.setVolume(70);
      player.playVideo();
      setIsPlayingSound(true);
    } else {
      player.mute();
      setIsPlayingSound(false);
    }
  }

  useImperativeHandle(ref, () => ({
    unmute() {
      const player = playerRef.current;
      if (!player || typeof player.unMute !== "function") return;
      player.unMute();
      player.setVolume(70);
      player.playVideo();
      setIsPlayingSound(true);
    },
  }));

  if (!videoId) return null;

  return (
    <div className="dua-player">
      <div className="dua-player-hidden"><div ref={containerRef}></div></div>
      <button 
        className={"dua-badge" + (isPlayingSound ? " is-playing" : "")} 
        onClick={toggleMute}
        title={isPlayingSound ? "Dua is playing softly (Click to mute)" : "Click to play background dua"}
        aria-label="Toggle background dua sound"
      >
        <span className="dua-bars" aria-hidden="true">
          <span className="dua-bar"></span>
          <span className="dua-bar"></span>
          <span className="dua-bar"></span>
          <span className="dua-bar"></span>
        </span>
        <span className="dua-text">Dua</span>
        <span className="dua-heart">🌸</span>
      </button>
    </div>
  );
});

function renderFormatted(text) {
  return String(text || "")
    .split(/\n\n+/)
    .map((para, pi) => (
      <p className="welcome-para" key={pi} style={{ animationDelay: (pi * 150 + 200) + "ms" }}>
        {para.split(/\*\*(.+?)\*\*/g).map((chunk, ci) =>
          ci % 2 === 1 ? <strong key={ci}>{chunk}</strong> : chunk
        )}
      </p>
    ));
}

function ConfettiShower() {
  const pieces = useMemo(() => {
    const colors = ["#ec4899", "#be185d", "#f472b6", "#fb7185", "#ffffff", "#fbcfe8"];
    return Array.from({ length: 30 }).map((_, i) => ({
      id: i,
      left: Math.round(Math.random() * 96),
      delay: (Math.random() * 3).toFixed(2),
      duration: (2.8 + Math.random() * 2.2).toFixed(2),
      size: Math.round(5 + Math.random() * 5),
      color: colors[i % colors.length],
      isBalloon: i % 6 === 0,
    }));
  }, []);

  return (
    <div className="confetti-shower" aria-hidden="true">
      {pieces.map((p) =>
        p.isBalloon ? (
          <span
            key={p.id}
            className="shower-balloon"
            style={{
              left: p.left + "%",
              animationDelay: p.delay + "s",
              animationDuration: (parseFloat(p.duration) + 1) + "s",
              background: p.color,
            }}
          />
        ) : (
          <span
            key={p.id}
            className="shower-confetti"
            style={{
              left: p.left + "%",
              animationDelay: p.delay + "s",
              animationDuration: p.duration + "s",
              background: p.color,
              width: p.size + "px",
              height: Math.round(p.size * 1.5) + "px",
            }}
          />
        )
      )}
    </div>
  );
}

function VideoScreen({ srcs, onDone }) {
  const list = Array.isArray(srcs) ? srcs : [srcs];
  const videoRef = useRef(null);
  const [index, setIndex] = useState(0);

  useEffect(() => {
    const v = videoRef.current;
    if (v) v.play().catch(() => {});
  }, [index]);

  function handleEnded() {
    if (index < list.length - 1) {
      setIndex((i) => i + 1);
    } else {
      onDone();
    }
  }

  return (
    <section className="screen video-screen active">
      <div className="video-cinema-wrap">
        <video
          ref={videoRef}
          key={index}
          className="intro-video"
          src={list[index]}
          controls
          playsInline
          onEnded={handleEnded}
        />
        {list.length > 1 && (
          <div className="video-progress-pill">
            <span>Video {index + 1} of {list.length}</span>
          </div>
        )}
      </div>
      <button className="video-continue" onClick={onDone}>
        <span>Skip to App ✦</span>
      </button>
    </section>
  );
}

const VIDEO_EXT = /\.(mp4|webm|mov)$/i;

function PhotoCard({ photo, onOpen }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  const [liked, setLiked] = useState(false);
  const isVideo = VIDEO_EXT.test(photo.src);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            setVisible(true);
            obs.unobserve(entry.target);
          }
        });
      },
      { threshold: 0.1, rootMargin: "0px 0px 50px 0px" }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);

  return (
    <div ref={ref} className={"photo-card" + (visible ? " in-view" : "")}>
      <div className="photo-card-inner">
        {isVideo ? (
          <div className="photo-media-wrapper">
            <video src={photo.src} controls playsInline preload="metadata" />
          </div>
        ) : (
          <div className="photo-media-wrapper" onClick={() => onOpen(photo)}>
            <img src={photo.src} alt={photo.caption || "Memory"} loading="lazy" />
            <div className="photo-hover-overlay">
              <span className="photo-zoom-icon">🔍</span>
            </div>
          </div>
        )}
        <button 
          className={"photo-like-btn" + (liked ? " liked" : "")} 
          onClick={(e) => { e.stopPropagation(); setLiked(!liked); }}
          title={liked ? "Liked!" : "Love this"}
          aria-label="Love this photo"
        >
          {liked ? "❤️" : "🤍"}
        </button>
      </div>
      {photo.caption ? (
        <div className="photo-caption">{photo.caption}</div>
      ) : null}
    </div>
  );
}

function MemoriesTab() {
  const photos = CONFIG.photos || [];
  const [lightbox, setLightbox] = useState(null);

  useEffect(() => {
    function handleKeyDown(e) {
      if (!lightbox) return;
      if (e.key === "Escape") setLightbox(null);
      if (e.key === "ArrowRight") {
        const idx = photos.findIndex((p) => p.src === lightbox.src);
        if (idx !== -1 && idx < photos.length - 1) setLightbox(photos[idx + 1]);
      }
      if (e.key === "ArrowLeft") {
        const idx = photos.findIndex((p) => p.src === lightbox.src);
        if (idx > 0) setLightbox(photos[idx - 1]);
      }
    }
    window.addEventListener("keydown", handleKeyDown);
    return () => window.removeEventListener("keydown", handleKeyDown);
  }, [lightbox, photos]);

  if (photos.length === 0) {
    return <p className="empty-hint">No photos added yet — habibi will add them soon, insha'Allah.</p>;
  }

  const currentIdx = lightbox ? photos.findIndex((p) => p.src === lightbox.src) : -1;

  return (
    <>
      <div className="photo-grid">
        {photos.map((p, i) => (
          <PhotoCard key={i} photo={p} onOpen={setLightbox} />
        ))}
      </div>
      {lightbox && ReactDOM.createPortal(
        <div className="lightbox" onClick={() => setLightbox(null)}>
          <div className="lightbox-content" onClick={(e) => e.stopPropagation()}>
            <button className="lightbox-close" onClick={() => setLightbox(null)} aria-label="Close">✕</button>
            
            {currentIdx > 0 && (
              <button 
                className="lightbox-nav lightbox-prev" 
                onClick={() => setLightbox(photos[currentIdx - 1])}
                aria-label="Previous photo"
              >
                ‹
              </button>
            )}

            <div className="lightbox-img-wrapper">
              <img src={lightbox.src} alt={lightbox.caption || ""} />
            </div>

            {currentIdx < photos.length - 1 && (
              <button 
                className="lightbox-nav lightbox-next" 
                onClick={() => setLightbox(photos[currentIdx + 1])}
                aria-label="Next photo"
              >
                ›
              </button>
            )}

            {lightbox.caption && <p className="lightbox-caption">{lightbox.caption}</p>}
          </div>
        </div>,
        document.body
      )}
    </>
  );
}

function HeartsGame() {
  const reasons = CONFIG.heartReasons || [];
  const [hearts] = useState(() =>
    reasons.map((reason, i) => ({
      id: i,
      reason,
      left: 8 + (i % 4) * 22 + (Math.random() * 8 - 4),
      top: 12 + Math.floor(i / 4) * 38 + (Math.random() * 10 - 5),
      delay: (Math.random() * 2).toFixed(2),
      duration: (3.2 + Math.random() * 1.8).toFixed(2),
    }))
  );
  const [popped, setPopped] = useState({});
  const [revealed, setRevealed] = useState([]);

  function pop(heart) {
    if (popped[heart.id]) return;
    setPopped((p) => ({ ...p, [heart.id]: true }));
    setRevealed((r) => [...r, heart.reason]);
  }

  if (reasons.length === 0) return null;
  const remaining = reasons.length - revealed.length;

  return (
    <div className="hearts-game-container">
      <h2 className="panel-title">Reasons I Love You 💖</h2>
      <p className="panel-subtitle">
        {remaining > 0 
          ? `Tap the floating hearts to reveal secrets (${revealed.length} of ${reasons.length} discovered)`
          : "You found all the reasons! Every single one is true 🤍"}
      </p>
      
      <div className="hearts-progress-bar">
        <div 
          className="hearts-progress-fill" 
          style={{ width: `${(revealed.length / reasons.length) * 100}%` }}
        />
      </div>

      <div className="hearts-field">
        {hearts.map((h) => (
          <button
            key={h.id}
            className={"floating-heart" + (popped[h.id] ? " popped" : "")}
            style={{
              left: h.left + "%",
              top: h.top + "%",
              animationDuration: h.duration + "s",
              animationDelay: h.delay + "s",
            }}
            onClick={() => pop(h)}
            aria-label="Pop a heart"
          >
            <span className="heart-emoji">💗</span>
            <span className="heart-sparkle-dot"></span>
          </button>
        ))}
      </div>

      {revealed.length > 0 && (
        <div className="revealed-section">
          <h3 className="revealed-heading">Discovered Secrets 💌</h3>
          <ul className="revealed-list">
            {revealed.map((r, i) => (
              <li key={i} className="revealed-item">
                <span className="revealed-number">{i + 1}</span>
                <span className="revealed-text">{r}</span>
                <span className="revealed-heart-icon">🤍</span>
              </li>
            ))}
          </ul>
        </div>
      )}
    </div>
  );
}

function ChatsCarousel({ snippets }) {
  const trackRef = useRef(null);
  const itemRefs = useRef([]);
  const [active, setActive] = useState(0);

  useEffect(() => {
    const track = trackRef.current;
    if (!track) return;
    const obs = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting && entry.intersectionRatio > 0.5) {
            const idx = itemRefs.current.indexOf(entry.target);
            if (idx !== -1) setActive(idx);
          }
        });
      },
      { root: track, threshold: 0.5 }
    );
    itemRefs.current.forEach((el) => el && obs.observe(el));
    return () => obs.disconnect();
  }, [snippets.length]);

  function goTo(i) {
    const el = itemRefs.current[i];
    if (el) el.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
  }

  return (
    <div className="chats-carousel-wrap">
      <div className="chats-carousel" ref={trackRef}>
        {snippets.map((s, i) => (
          <div
            className={"carousel-item" + (i === active ? " active-slide" : "")}
            key={i}
            ref={(el) => (itemRefs.current[i] = el)}
          >
            <div className="chat-card-wrap">
              {s.image ? (
                <img className="chat-screenshot" src={s.image} alt={s.text || "Chat memory"} />
              ) : (
                <div className={"chat-bubble" + (s.from === "her" ? " chat-bubble-her" : "")}>{s.text}</div>
              )}
            </div>
          </div>
        ))}
      </div>
      <div className="carousel-controls">
        <button 
          className="carousel-arrow" 
          onClick={() => goTo(Math.max(0, active - 1))} 
          disabled={active === 0} 
          aria-label="Previous"
        >
          ‹
        </button>
        <div className="carousel-dots">
          {snippets.map((_, i) => (
            <span 
              key={i} 
              className={"carousel-dot" + (i === active ? " active" : "")} 
              onClick={() => goTo(i)}
            />
          ))}
        </div>
        <button
          className="carousel-arrow"
          onClick={() => goTo(Math.min(snippets.length - 1, active + 1))}
          disabled={active === snippets.length - 1}
          aria-label="Next"
        >
          ›
        </button>
      </div>
    </div>
  );
}

function loadWishes() {
  try {
    const raw = localStorage.getItem("fadilah-wishlist");
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return (CONFIG.wishlistSeed || []).map((text) => ({ text, done: false }));
}

function WishlistTab() {
  const [wishes, setWishes] = useState(loadWishes);
  const [input, setInput] = useState("");

  useEffect(() => {
    try {
      localStorage.setItem("fadilah-wishlist", JSON.stringify(wishes));
    } catch (e) {}
  }, [wishes]);

  function addWish(e) {
    e.preventDefault();
    const val = input.trim();
    if (!val) return;
    setWishes((w) => [...w, { text: val, done: false }]);
    setInput("");
  }

  function toggle(i) {
    setWishes((w) => w.map((item, idx) => (idx === i ? { ...item, done: !item.done } : item)));
  }

  function remove(i) {
    setWishes((w) => w.filter((_, idx) => idx !== i));
  }

  return (
    <div className="wishlist-container">
      <h2 className="panel-title">Our Wishlist & Dreams 🌟</h2>
      <p className="panel-subtitle">Places we will go, things we will do, insha'Allah.</p>
      
      <form className="wishlist-form" onSubmit={addWish}>
        <input
          type="text"
          placeholder="Add a new dream or wish..."
          autoComplete="off"
          value={input}
          onChange={(e) => setInput(e.target.value)}
        />
        <button type="submit" className="btn-primary small">
          <span>Add Wish ✦</span>
        </button>
      </form>

      <ul className="wishlist-list">
        {wishes.map((wish, i) => (
          <li key={i} className={wish.done ? "done" : ""}>
            <button 
              className={"wish-check" + (wish.done ? " checked" : "")} 
              onClick={() => toggle(i)}
              aria-label="Toggle completed"
            >
              {wish.done ? "✓" : ""}
            </button>
            <span className="wish-text">{wish.text}</span>
            <button className="wish-remove" onClick={() => remove(i)} title="Remove wish" aria-label="Remove">✕</button>
          </li>
        ))}
      </ul>
    </div>
  );
}

function NasheedsTab({ current, onPlay }) {
  const nasheeds = CONFIG.nasheeds || [];
  if (nasheeds.length === 0) {
    return (
      <div className="nasheeds-wrapper">
        <h2 className="panel-title">Nasheeds For You 🎵</h2>
        <p className="empty-hint">No songs added yet — check back soon, insha'Allah.</p>
      </div>
    );
  }
  return (
    <div className="nasheeds-wrapper">
      <h2 className="panel-title">Nasheeds For You 🎵</h2>
      <p className="panel-subtitle">Peaceful melodies to soothe the heart</p>
      <ul className="nasheed-list">
        {nasheeds.map((track, i) => (
          <li key={i} className={i === current ? "playing" : ""} onClick={() => onPlay(i)}>
            <div className="nasheed-track-left">
              <span className="track-number">{i + 1}</span>
              <span className="track-title">{track.title}</span>
            </div>
            <div className="nasheed-track-right">
              {i === current ? (
                <span className="playing-indicator">
                  <span></span><span></span><span></span>
                </span>
              ) : (
                <span className="play-icon">▶</span>
              )}
            </div>
          </li>
        ))}
      </ul>
    </div>
  );
}

function MiniPlayer({ current, isPlaying, progress, title, onToggle, onNext }) {
  if (current === -1) return null;
  return (
    <div className="mini-player">
      <button className="player-toggle" onClick={onToggle} aria-label={isPlaying ? "Pause" : "Play"}>
        {isPlaying ? "⏸" : "▶"}
      </button>
      <div className="player-info">
        <div className="player-title">{title}</div>
        <div className="player-bar">
          <div className="player-progress" style={{ width: progress + "%" }}></div>
        </div>
      </div>
      <button className="player-next" onClick={onNext} aria-label="Next track">⏭</button>
    </div>
  );
}

function MainApp({ banner }) {
  const [tab, setTab] = useState("memories");
  const nasheeds = CONFIG.nasheeds || [];
  const [current, setCurrent] = useState(-1);
  const [isPlaying, setIsPlaying] = useState(false);
  const [progress, setProgress] = useState(0);
  const audioRef = useRef(null);

  function playTrack(i) {
    setCurrent(i);
    setIsPlaying(true);
  }

  useEffect(() => {
    const audio = audioRef.current;
    if (!audio || current === -1) return;
    audio.src = nasheeds[current].src;
    audio.play().catch(() => {});
  }, [current]);

  useEffect(() => {
    const audio = audioRef.current;
    if (!audio) return;
    if (isPlaying) audio.play().catch(() => {});
    else audio.pause();
  }, [isPlaying]);

  function togglePlay() {
    if (current === -1) {
      if (nasheeds.length) playTrack(0);
      return;
    }
    setIsPlaying((p) => !p);
  }

  function next() {
    if (nasheeds.length === 0) return;
    playTrack((current + 1) % nasheeds.length);
  }

  return (
    <div className="app active">
      <header className="app-header">
        <div className="app-brand-pill">
          <span className="app-title">✦ For Fadilah ✦</span>
        </div>
        {banner && <div className="app-banner">{banner}</div>}
        <nav className="tabs">
          <button className={"tab-btn" + (tab === "memories" ? " active" : "")} onClick={() => setTab("memories")}>
            <span className="tab-icon">📸</span> Memories
          </button>
          {CONFIG.letter && (
            <button className={"tab-btn" + (tab === "letter" ? " active" : "")} onClick={() => setTab("letter")}>
              <span className="tab-icon">💌</span> Letter
            </button>
          )}
          {CONFIG.heartReasons && CONFIG.heartReasons.length > 0 && (
            <button className={"tab-btn" + (tab === "hearts" ? " active" : "")} onClick={() => setTab("hearts")}>
              <span className="tab-icon">💖</span> Hearts
            </button>
          )}
          {CONFIG.chatSnippets && (
            <button className={"tab-btn" + (tab === "chats" ? " active" : "")} onClick={() => setTab("chats")}>
              <span className="tab-icon">💬</span> Chats
            </button>
          )}
          <button className={"tab-btn" + (tab === "wishlist" ? " active" : "")} onClick={() => setTab("wishlist")}>
            <span className="tab-icon">🌟</span> Wishlist
          </button>
          <button className={"tab-btn" + (tab === "music" ? " active" : "")} onClick={() => setTab("music")}>
            <span className="tab-icon">🎵</span> Nasheeds
          </button>
        </nav>
      </header>

      <main>
        <section className={"tab-panel" + (tab === "memories" ? " active" : "")}>
          <ConfettiShower />
          <h2 className="panel-title">Our Moments Together 📸</h2>
          <p className="panel-subtitle">Every photo carries a piece of my heart</p>
          <MemoriesTab />
        </section>
        {CONFIG.letter && (
          <section className={"tab-panel" + (tab === "letter" ? " active" : "")}>
            <LetterTab />
          </section>
        )}
        {CONFIG.heartReasons && CONFIG.heartReasons.length > 0 && (
          <section className={"tab-panel" + (tab === "hearts" ? " active" : "")}>
            <HeartsGame />
          </section>
        )}
        {CONFIG.chatSnippets && (
          <section className={"tab-panel" + (tab === "chats" ? " active" : "")}>
            <ChatsTab />
          </section>
        )}
        <section className={"tab-panel" + (tab === "wishlist" ? " active" : "")}>
          <WishlistTab />
        </section>
        <section className={"tab-panel" + (tab === "music" ? " active" : "")}>
          <NasheedsTab current={current} onPlay={playTrack} />
        </section>
      </main>

      <MiniPlayer
        current={current}
        isPlaying={isPlaying}
        progress={progress}
        title={current === -1 ? "—" : nasheeds[current].title}
        onToggle={togglePlay}
        onNext={next}
      />
      <audio
        ref={audioRef}
        preload="none"
        onEnded={next}
        onPlay={() => setIsPlaying(true)}
        onPause={() => setIsPlaying(false)}
        onTimeUpdate={(e) => {
          const a = e.target;
          if (a.duration) setProgress((a.currentTime / a.duration) * 100);
        }}
      />
    </div>
  );
}

function App() {
  const [stage, setStage] = useState("achievement");
  const banner = useMemo(() => specialBannerText(), []);
  const duaRef = useRef(null);

  useEffect(() => {
    document.title = CONFIG.siteTitle;
  }, []);

  useEffect(() => {
    function unmuteOnFirstTouch() {
      if (duaRef.current) duaRef.current.unmute();
    }
    document.addEventListener("click", unmuteOnFirstTouch, { once: true });
    document.addEventListener("touchstart", unmuteOnFirstTouch, { once: true });
    document.addEventListener("keydown", unmuteOnFirstTouch, { once: true });
    return () => {
      document.removeEventListener("click", unmuteOnFirstTouch);
      document.removeEventListener("touchstart", unmuteOnFirstTouch);
      document.removeEventListener("keydown", unmuteOnFirstTouch);
    };
  }, []);

  function handleAchievementNext() {
    if (duaRef.current) duaRef.current.unmute();
    setStage("gate");
  }

  function handleBegin() {
    if (duaRef.current) duaRef.current.unmute();
    setStage("hearts");
  }

  function handleEnter() {
    const hasVideo = CONFIG.introVideos && CONFIG.introVideos.length > 0;
    setStage(hasVideo ? "video" : "app");
  }

  return (
    <>
      <Stars />
      <DuaPlayer ref={duaRef} />
      {stage === "achievement" && <AchievementScreen onNext={handleAchievementNext} />}
      {stage === "gate" && <GateScreen onBegin={handleBegin} banner={banner} />}
      {stage === "hearts" && <HeartsIntroScreen onNext={() => setStage("chats")} />}
      {stage === "chats" && <ChatsIntroScreen onNext={() => setStage("welcome")} />}
      {stage === "welcome" && <WelcomeScreen banner={banner} onEnter={handleEnter} />}
      {stage === "video" && <VideoScreen srcs={CONFIG.introVideos} onDone={() => setStage("app")} />}
      {stage === "app" && <MainApp banner={banner} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

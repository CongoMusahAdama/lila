<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>For Fadilah</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=Poppins:wght@300;400;500;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="root"></div>

<script src="config.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/plain" id="app-source">
const { useState, useEffect, useRef, useMemo, forwardRef, useImperativeHandle } = React;

function specialBannerText() {
  const now = new Date();
  const mm = String(now.getMonth() + 1).padStart(2, "0");
  const dd = String(now.getDate()).padStart(2, "0");
  const isBirthday = CONFIG.herBirthday === `${mm}-${dd}`;
  const isJummah = now.getDay() === 5;

  if (isBirthday && isJummah) return `Jummah Mubarak & Happy Birthday, ${CONFIG.herName}! 🎉🌙`;
  if (isBirthday) return `Happy Birthday, ${CONFIG.herName}! 🎉`;
  if (isJummah) return "Jummah Mubarak 🌙";
  return null;
}

function Stars() {
  return <div className="stars" aria-hidden="true"></div>;
}

const DuaPlayer = forwardRef(function DuaPlayer(props, ref) {
  const playerRef = useRef(null);
  const containerRef = useRef(null);
  const videoId = CONFIG.duaVideoId;

  useEffect(() => {
    if (!videoId) return;

    function createPlayer() {
      playerRef.current = new window.YT.Player(containerRef.current, {
        videoId: videoId,
        width: "160",
        height: "160",
        playerVars: {
          autoplay: 1,
          mute: 1,
          loop: 1,
          playlist: videoId,
          controls: 0,
          playsinline: 1,
          modestbranding: 1,
        },
        events: {
          onReady: function (e) { e.target.playVideo(); },
        },
      });
    }

    if (window.YT && window.YT.Player) {
      createPlayer();
    } else {
      const tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      document.body.appendChild(tag);
      window.onYouTubeIframeAPIReady = createPlayer;
    }
  }, [videoId]);

  useImperativeHandle(ref, () => ({
    unmute() {
      const player = playerRef.current;
      if (!player || typeof player.unMute !== "function") return;
      player.unMute();
      player.setVolume(70);
      player.playVideo();
    },
  }));

  if (!videoId) return null;

  return (
    <div className="dua-player">
      <div className="dua-player-hidden"><div ref={containerRef}></div></div>
      <div className="dua-badge" title="A dua is playing softly">
        <svg viewBox="0 0 100 24" className="dua-wave" aria-hidden="true">
          <path
            d="M2 12 h14 l4 -8 l5 16 l4 -18 l4 20 l4 -14 l4 6 h14 l4 -6 l4 10 h13"
            fill="none"
            stroke="currentColor"
            strokeWidth="2.2"
            strokeLinecap="round"
            strokeLinejoin="round"
          />
        </svg>
        <span className="dua-heart">🩷</span>
      </div>
    </div>
  );
});

function AchievementScreen({ onNext }) {
  const today = new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  return (
    <section className="screen achievement-screen active">
      <div className="achievement-card">
        <div className="achievement-icon">
          <span className="achievement-heart">❤️</span>
        </div>
        <h1 className="achievement-title">For My Fadilah</h1>
        <p className="achievement-subtitle">Earned through every day we've shared</p>
        <p className="achievement-date">{today}</p>
        <p className="achievement-desc">
          A little surprise made just for you, with everything I couldn't fully say out loud.
        </p>
        <button className="achievement-next" onClick={onNext}>Next <span>→</span></button>
      </div>
    </section>
  );
}

function GateScreen({ onBegin, banner }) {
  const bgStyle = CONFIG.gateBackground
    ? {
        backgroundImage:
          "linear-gradient(rgba(0,0,0,0.05), rgba(0,0,0,0.15)), url('" +
          CONFIG.gateBackground +
          "')",
        backgroundSize: "cover",
        backgroundPosition: "center 15%",
      }
    : {};

  return (
    <section className="screen screen-gate active" style={bgStyle}>
      <div className="gate-content">
        <h1 className="gate-heading">Assalamu Alaikum, {CONFIG.herName}</h1>
        {banner && <p className="special-banner">{banner}</p>}
        <p className="subtitle gate-subtitle">A little something made just for you.</p>
        <button className="btn-primary" onClick={onBegin}>Begin</button>
      </div>
    </section>
  );
}

function renderFormatted(text) {
  return String(text || "")
    .split(/\n\n+/)
    .map((para, pi) => (
      <p className="welcome-para" key={pi} style={{ animationDelay: pi * 220 + "ms" }}>
        {para.split(/\*\*(.+?)\*\*/g).map((chunk, ci) =>
          ci % 2 === 1 ? <strong key={ci}>{chunk}</strong> : chunk
        )}
      </p>
    ));
}

function WelcomeScreen({ banner, onEnter }) {
  return (
    <section className="screen active">
      <div className="card wide">
        <ConfettiShower />
        {CONFIG.welcomePhoto ? (
          <img className="welcome-photo" src={CONFIG.welcomePhoto} alt="" />
        ) : (
          <div className="crescent">✦</div>
        )}
        <h1>My {CONFIG.herName}</h1>
        {banner && <p className="special-banner">{banner}</p>}
        <div className="welcome-message">{renderFormatted(CONFIG.welcomeMessage)}</div>
        <button className="btn-primary" onClick={onEnter}>Enter</button>
      </div>
    </section>
  );
}

function HeartsIntroScreen({ onNext }) {
  return (
    <section className="screen intro-scroll-screen active">
      <div className="card wide">
        <HeartsGame />
      </div>
      <div className="intro-continue-bar">
        <button className="btn-primary" onClick={onNext}>Continue ✦</button>
      </div>
    </section>
  );
}

function ChatsIntroScreen({ onNext }) {
  return (
    <section className="screen intro-scroll-screen active">
      <div className="card wide">
        <ChatsTab />
      </div>
      <div className="intro-continue-bar">
        <button className="btn-primary" onClick={onNext}>Continue ✦</button>
      </div>
    </section>
  );
}

function ConfettiShower() {
  const pieces = useMemo(() => {
    const colors = ["var(--pink)", "var(--pink-deep)", "var(--pink-soft)", "#ffffff"];
    return Array.from({ length: 26 }).map((_, i) => ({
      id: i,
      left: Math.round(Math.random() * 96),
      delay: (Math.random() * 3).toFixed(2),
      duration: (2.6 + Math.random() * 2.2).toFixed(2),
      size: Math.round(5 + Math.random() * 4),
      color: colors[i % colors.length],
      isBalloon: i % 5 === 0,
    }));
  }, []);

  return (
    <div className="confetti-shower" aria-hidden="true">
      {pieces.map((p) =>
        p.isBalloon ? (
          <span
            key={p.id}
            className="shower-balloon"
            style={{
              left: p.left + "%",
              animationDelay: p.delay + "s",
              animationDuration: (parseFloat(p.duration) + 1) + "s",
              background: p.color,
            }}
          />
        ) : (
          <span
            key={p.id}
            className="shower-confetti"
            style={{
              left: p.left + "%",
              animationDelay: p.delay + "s",
              animationDuration: p.duration + "s",
              background: p.color,
              width: p.size + "px",
              height: Math.round(p.size * 1.6) + "px",
            }}
          />
        )
      )}
    </div>
  );
}

function VideoScreen({ srcs, onDone }) {
  const list = Array.isArray(srcs) ? srcs : [srcs];
  const videoRef = useRef(null);
  const [index, setIndex] = useState(0);

  useEffect(() => {
    const v = videoRef.current;
    if (v) v.play().catch(() => {});
  }, [index]);

  function handleEnded() {
    if (index < list.length - 1) {
      setIndex((i) => i + 1);
    } else {
      onDone();
    }
  }

  return (
    <section className="screen video-screen active">
      <video
        ref={videoRef}
        key={index}
        className="intro-video"
        src={list[index]}
        controls
        muted
        playsInline
        onEnded={handleEnded}
      />
      {list.length > 1 && (
        <p className="video-progress">{index + 1} / {list.length}</p>
      )}
      <button className="video-continue" onClick={onDone}>Skip ✦</button>
    </section>
  );
}

const VIDEO_EXT = /\.(mp4|webm|mov)$/i;

function PhotoCard({ photo, onOpen }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  const isVideo = VIDEO_EXT.test(photo.src);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            setVisible(true);
            obs.unobserve(entry.target);
          }
        });
      },
      { threshold: 0.15, rootMargin: "0px 0px -30px 0px" }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);

  return (
    <div ref={ref} className={"photo-card" + (visible ? " in-view" : "")}>
      {isVideo ? (
        <video src={photo.src} controls playsInline preload="metadata" />
      ) : (
        <img src={photo.src} alt={photo.caption || ""} loading="lazy" onClick={() => onOpen(photo)} />
      )}
      <div className="photo-caption">{photo.caption || ""}</div>
    </div>
  );
}

function MemoriesTab() {
  const photos = CONFIG.photos || [];
  const [lightbox, setLightbox] = useState(null);

  if (photos.length === 0) {
    return <p className="empty-hint">No photos added yet — habibi will add them soon, insha'Allah.</p>;
  }

  return (
    <>
      <div className="photo-grid">
        {photos.map((p, i) => (
          <PhotoCard key={i} photo={p} onOpen={setLightbox} />
        ))}
      </div>
      {lightbox && ReactDOM.createPortal(
        <div className="lightbox" onClick={() => setLightbox(null)}>
          <button className="lightbox-close" onClick={() => setLightbox(null)}>✕</button>
          <img src={lightbox.src} alt={lightbox.caption || ""} onClick={(e) => e.stopPropagation()} />
          {lightbox.caption && <p className="lightbox-caption">{lightbox.caption}</p>}
        </div>,
        document.body
      )}
    </>
  );
}

function LetterTab() {
  const letter = CONFIG.letter;
  if (!letter) return null;
  return (
    <div className="letter">
      {letter.photo && (
        <div className="polaroid">
          <img src={letter.photo} alt="" />
        </div>
      )}
      <p className="letter-greeting">{letter.greeting}</p>
      <p className="letter-body">{letter.body}</p>
      <p className="letter-signature">{letter.signature}</p>
    </div>
  );
}

function HeartsGame() {
  const reasons = CONFIG.heartReasons || [];
  const [hearts] = useState(() =>
    reasons.map((reason, i) => ({
      id: i,
      reason,
      left: 6 + Math.random() * 80,
      top: 6 + Math.random() * 68,
      delay: (Math.random() * 2).toFixed(2),
      duration: (3 + Math.random() * 2).toFixed(2),
    }))
  );
  const [popped, setPopped] = useState({});
  const [revealed, setRevealed] = useState([]);

  function pop(heart) {
    if (popped[heart.id]) return;
    setPopped((p) => ({ ...p, [heart.id]: true }));
    setRevealed((r) => [...r, heart.reason]);
  }

  if (reasons.length === 0) return null;
  const remaining = reasons.length - revealed.length;

  return (
    <>
      <h2 className="panel-title">Pop a Heart 💗</h2>
      <p className="panel-subtitle">
        {remaining > 0 ? "Tap each heart to find a reason I love you" : "You found them all 🤍"}
      </p>
      <div className="hearts-field">
        {hearts.map((h) => (
          <button
            key={h.id}
            className={"floating-heart" + (popped[h.id] ? " popped" : "")}
            style={
              popped[h.id]
                ? { left: h.left + "%", top: h.top + "%" }
                : { left: h.left + "%", top: h.top + "%", animationDuration: h.duration + "s", animationDelay: h.delay + "s" }
            }
            onClick={() => pop(h)}
            aria-label="Pop a heart"
          >
            💗
          </button>
        ))}
      </div>
      {revealed.length > 0 && (
        <ul className="revealed-list">
          {revealed.map((r, i) => (
            <li key={i} className="revealed-item">{r}</li>
          ))}
        </ul>
      )}
    </>
  );
}

function ChatsCarousel({ snippets }) {
  const trackRef = useRef(null);
  const itemRefs = useRef([]);
  const [active, setActive] = useState(0);

  useEffect(() => {
    const track = trackRef.current;
    if (!track) return;
    const obs = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting && entry.intersectionRatio > 0.5) {
            const idx = itemRefs.current.indexOf(entry.target);
            if (idx !== -1) setActive(idx);
          }
        });
      },
      { root: track, threshold: 0.5 }
    );
    itemRefs.current.forEach((el) => el && obs.observe(el));
    return () => obs.disconnect();
  }, [snippets.length]);

  function goTo(i) {
    const el = itemRefs.current[i];
    if (el) el.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
  }

  return (
    <div className="chats-carousel-wrap">
      <div className="chats-carousel" ref={trackRef}>
        {snippets.map((s, i) => (
          <div
            className={"carousel-item" + (i === active ? " active-slide" : "")}
            key={i}
            ref={(el) => (itemRefs.current[i] = el)}
          >
            {s.image ? (
              <img className="chat-screenshot" src={s.image} alt={s.text || ""} />
            ) : (
              <div className={"chat-bubble" + (s.from === "her" ? " chat-bubble-her" : "")}>{s.text}</div>
            )}
          </div>
        ))}
      </div>
      <div className="carousel-controls">
        <button className="carousel-arrow" onClick={() => goTo(active - 1)} disabled={active === 0} aria-label="Previous">‹</button>
        <div className="carousel-dots">
          {snippets.map((_, i) => (
            <span key={i} className={"carousel-dot" + (i === active ? " active" : "")} onClick={() => goTo(i)}></span>
          ))}
        </div>
        <button
          className="carousel-arrow"
          onClick={() => goTo(active + 1)}
          disabled={active === snippets.length - 1}
          aria-label="Next"
        >
          ›
        </button>
      </div>
    </div>
  );
}

function ChatsTab() {
  const snippets = CONFIG.chatSnippets || [];

  if (snippets.length === 0) {
    return (
      <>
        <h2 className="panel-title chats-heading">Us, In Our Own Words <span className="chats-heading-icon">💌</span></h2>
        <p className="empty-hint">Coming soon — a few of our favorite texts, right here.</p>
      </>
    );
  }

  return (
    <>
      <h2 className="panel-title chats-heading">Us, In Our Own Words <span className="chats-heading-icon">💌</span></h2>
      <ChatsCarousel snippets={snippets} />
    </>
  );
}

function loadWishes() {
  try {
    const raw = localStorage.getItem("fadilah-wishlist");
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return (CONFIG.wishlistSeed || []).map((text) => ({ text, done: false }));
}

function WishlistTab() {
  const [wishes, setWishes] = useState(loadWishes);
  const [input, setInput] = useState("");

  useEffect(() => {
    try {
      localStorage.setItem("fadilah-wishlist", JSON.stringify(wishes));
    } catch (e) {}
  }, [wishes]);

  function addWish(e) {
    e.preventDefault();
    const val = input.trim();
    if (!val) return;
    setWishes((w) => [...w, { text: val, done: false }]);
    setInput("");
  }

  function toggle(i) {
    setWishes((w) => w.map((item, idx) => (idx === i ? { ...item, done: !item.done } : item)));
  }

  function remove(i) {
    setWishes((w) => w.filter((_, idx) => idx !== i));
  }

  return (
    <>
      <h2 className="panel-title">Your Wishlist</h2>
      <p className="panel-subtitle">Add anything you wish for, big or small.</p>
      <form className="wishlist-form" onSubmit={addWish}>
        <input
          type="text"
          placeholder="I wish for..."
          autoComplete="off"
          value={input}
          onChange={(e) => setInput(e.target.value)}
        />
        <button type="submit" className="btn-primary small">Add</button>
      </form>
      <ul className="wishlist-list">
        {wishes.map((wish, i) => (
          <li key={i} className={wish.done ? "done" : ""}>
            <button className={"wish-check" + (wish.done ? " checked" : "")} onClick={() => toggle(i)}></button>
            <span className="wish-text">{wish.text}</span>
            <button className="wish-remove" onClick={() => remove(i)}>✕</button>
          </li>
        ))}
      </ul>
    </>
  );
}

function NasheedsTab({ current, onPlay }) {
  const nasheeds = CONFIG.nasheeds || [];
  if (nasheeds.length === 0) {
    return (
      <>
        <h2 className="panel-title">Nasheeds For You</h2>
        <p className="empty-hint">No songs added yet — check back soon, insha'Allah.</p>
      </>
    );
  }
  return (
    <>
      <h2 className="panel-title">Nasheeds For You</h2>
      <ul className="nasheed-list">
        {nasheeds.map((track, i) => (
          <li key={i} className={i === current ? "playing" : ""} onClick={() => onPlay(i)}>
            {track.title}
          </li>
        ))}
      </ul>
    </>
  );
}

function MiniPlayer({ current, isPlaying, progress, title, onToggle, onNext }) {
  if (current === -1) return null;
  return (
    <div className="mini-player">
      <button className="player-toggle" onClick={onToggle}>{isPlaying ? "⏸" : "▶"}</button>
      <div className="player-info">
        <div className="player-title">{title}</div>
        <div className="player-bar"><div className="player-progress" style={{ width: progress + "%" }}></div></div>
      </div>
      <button className="player-next" onClick={onNext}>⏭</button>
    </div>
  );
}

function MainApp({ banner }) {
  const [tab, setTab] = useState("memories");
  const nasheeds = CONFIG.nasheeds || [];
  const [current, setCurrent] = useState(-1);
  const [isPlaying, setIsPlaying] = useState(false);
  const [progress, setProgress] = useState(0);
  const audioRef = useRef(null);

  function playTrack(i) {
    setCurrent(i);
    setIsPlaying(true);
  }

  useEffect(() => {
    const audio = audioRef.current;
    if (!audio || current === -1) return;
    audio.src = nasheeds[current].src;
    audio.play().catch(() => {});
  }, [current]);

  useEffect(() => {
    const audio = audioRef.current;
    if (!audio) return;
    if (isPlaying) audio.play().catch(() => {});
    else audio.pause();
  }, [isPlaying]);

  function togglePlay() {
    if (current === -1) {
      if (nasheeds.length) playTrack(0);
      return;
    }
    setIsPlaying((p) => !p);
  }

  function next() {
    if (nasheeds.length === 0) return;
    playTrack((current + 1) % nasheeds.length);
  }

  return (
    <div className="app active">
      <header className="app-header">
        <span className="app-title">✦ For Fadilah ✦</span>
        {banner && <p className="app-banner">{banner}</p>}
        <nav className="tabs">
          <button className={"tab-btn" + (tab === "memories" ? " active" : "")} onClick={() => setTab("memories")}>Memories</button>
          {CONFIG.letter && (
            <button className={"tab-btn" + (tab === "letter" ? " active" : "")} onClick={() => setTab("letter")}>Letter</button>
          )}
          {CONFIG.heartReasons && CONFIG.heartReasons.length > 0 && (
            <button className={"tab-btn" + (tab === "hearts" ? " active" : "")} onClick={() => setTab("hearts")}>Hearts</button>
          )}
          {CONFIG.chatSnippets && (
            <button className={"tab-btn" + (tab === "chats" ? " active" : "")} onClick={() => setTab("chats")}>Chats</button>
          )}
          <button className={"tab-btn" + (tab === "wishlist" ? " active" : "")} onClick={() => setTab("wishlist")}>Wishlist</button>
          <button className={"tab-btn" + (tab === "music" ? " active" : "")} onClick={() => setTab("music")}>Nasheeds</button>
        </nav>
      </header>

      <main>
        <section className={"tab-panel" + (tab === "memories" ? " active" : "")}>
          <ConfettiShower />
          <h2 className="panel-title">Our Memories</h2>
          <MemoriesTab />
        </section>
        {CONFIG.letter && (
          <section className={"tab-panel" + (tab === "letter" ? " active" : "")}>
            <LetterTab />
          </section>
        )}
        {CONFIG.heartReasons && CONFIG.heartReasons.length > 0 && (
          <section className={"tab-panel" + (tab === "hearts" ? " active" : "")}>
            <HeartsGame />
          </section>
        )}
        {CONFIG.chatSnippets && (
          <section className={"tab-panel" + (tab === "chats" ? " active" : "")}>
            <ChatsTab />
          </section>
        )}
        <section className={"tab-panel" + (tab === "wishlist" ? " active" : "")}>
          <WishlistTab />
        </section>
        <section className={"tab-panel" + (tab === "music" ? " active" : "")}>
          <NasheedsTab current={current} onPlay={playTrack} />
        </section>
      </main>

      <MiniPlayer
        current={current}
        isPlaying={isPlaying}
        progress={progress}
        title={current === -1 ? "—" : nasheeds[current].title}
        onToggle={togglePlay}
        onNext={next}
      />
      <audio
        ref={audioRef}
        preload="none"
        onEnded={next}
        onPlay={() => setIsPlaying(true)}
        onPause={() => setIsPlaying(false)}
        onTimeUpdate={(e) => {
          const a = e.target;
          if (a.duration) setProgress((a.currentTime / a.duration) * 100);
        }}
      />
    </div>
  );
}

function App() {
  const [stage, setStage] = useState("achievement");
  const banner = useMemo(() => specialBannerText(), []);
  const duaRef = useRef(null);

  useEffect(() => {
    document.title = CONFIG.siteTitle;
  }, []);

  useEffect(() => {
    function unmuteOnFirstTouch() {
      if (duaRef.current) duaRef.current.unmute();
    }
    document.addEventListener("click", unmuteOnFirstTouch, { once: true });
    document.addEventListener("touchstart", unmuteOnFirstTouch, { once: true });
    document.addEventListener("keydown", unmuteOnFirstTouch, { once: true });
    return () => {
      document.removeEventListener("click", unmuteOnFirstTouch);
      document.removeEventListener("touchstart", unmuteOnFirstTouch);
      document.removeEventListener("keydown", unmuteOnFirstTouch);
    };
  }, []);

  function handleAchievementNext() {
    if (duaRef.current) duaRef.current.unmute();
    setStage("gate");
  }

  function handleBegin() {
    if (duaRef.current) duaRef.current.unmute();
    setStage("hearts");
  }

  function handleEnter() {
    const hasVideo = CONFIG.introVideos && CONFIG.introVideos.length > 0;
    setStage(hasVideo ? "video" : "app");
  }

  return (
    <>
      <Stars />
      <DuaPlayer ref={duaRef} />
      {stage === "achievement" && <AchievementScreen onNext={handleAchievementNext} />}
      {stage === "gate" && <GateScreen onBegin={handleBegin} banner={banner} />}
      {stage === "hearts" && <HeartsIntroScreen onNext={() => setStage("chats")} />}
      {stage === "chats" && <ChatsIntroScreen onNext={() => setStage("welcome")} />}
      {stage === "welcome" && <WelcomeScreen banner={banner} onEnter={handleEnter} />}
      {stage === "video" && <VideoScreen srcs={CONFIG.introVideos} onDone={() => setStage("app")} />}
      {stage === "app" && <MainApp banner={banner} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

  var runner = document.createElement("script");
  runner.text = output;
  document.body.appendChild(runner);
</script>
</body>
